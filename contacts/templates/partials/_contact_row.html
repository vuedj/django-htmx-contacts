<tr>
  <td>{{ contact.name }}</td>
  <td>{{ contact.email }}</td>
  <td>{{ contact.created_at|date:"M d, Y" }}</td>
  <td>
    <button class="btn btn-xs btn-error"
            type="button"
            hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
            hx-delete="{% url 'delete-contact' contact.pk %}"
            hx-target="#contacts-list"
            hx-swap="outerHTML"
            hx-confirm="Are you sure you wish to delete this contact?">Delete</button>
  </td>
</tr>
